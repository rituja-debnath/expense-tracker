<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>expense tracker</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f8f7f4;
    color: #1d1d1f;
    min-height: 100vh;
    padding: 0 0 32px;
  }
  .container {
    max-width: 480px;
    margin: 0 auto;
    padding: 0 20px;
  }
  .header {
    text-align: center;
    padding: 32px 0 6px;
  }
  .header h1 {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 3px;
    color: #c4c4c0;
    margin-bottom: 2px;
  }
  .month-nav {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 24px;
  }
  .month-nav button {
    background: none;
    border: none;
    font-size: 20px;
    cursor: pointer;
    color: #c4c4c0;
    padding: 4px 8px;
    line-height: 1;
    transition: color 0.2s;
  }
  .month-nav button:active { color: #1d1d1f; }
  .month-nav .month {
    font-size: 22px;
    font-weight: 700;
    color: #1d1d1f;
    min-width: 180px;
  }

  .total-card {
    background: linear-gradient(135deg, #1d1d1f 0%, #2d2d2f 100%);
    color: #fff;
    border-radius: 24px;
    padding: 28px 24px 24px;
    margin: 20px 0 16px;
    position: relative;
    overflow: hidden;
  }
  .total-card::before {
    content: '';
    position: absolute;
    top: -40%;
    right: -20%;
    width: 200px;
    height: 200px;
    border-radius: 50%;
    background: rgba(255,255,255,0.03);
  }
  .total-card .label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 2.5px;
    color: #86868b;
  }
  .total-card .amount-row {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-top: 6px;
  }
  .total-card .amount-row .currency {
    font-size: 22px;
    font-weight: 400;
    color: #86868b;
  }
  .total-card .amount-row .amount {
    font-size: 44px;
    font-weight: 700;
    letter-spacing: -2px;
  }
  .total-card .sub-info {
    display: flex;
    gap: 24px;
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid rgba(255,255,255,0.08);
  }
  .total-card .sub-info div {
    font-size: 12px;
    color: #86868b;
  }
  .total-card .sub-info span {
    color: #fff;
    font-weight: 600;
  }

  .form-card {
    background: #fff;
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.04);
  }
  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .form-grid .full { grid-column: 1 / -1; }
  .form-grid input,
  .form-grid select {
    width: 100%;
    padding: 14px 16px;
    border: 1.5px solid #f0efe9;
    border-radius: 14px;
    font-size: 15px;
    background: #f8f7f4;
    color: #1d1d1f;
    outline: none;
    transition: border-color 0.2s;
  }
  .form-grid input:focus,
  .form-grid select:focus { border-color: #1d1d1f; }
  .form-grid input::placeholder { color: #c4c4c0; }
  .form-grid select { appearance: none; -webkit-appearance: none; cursor: pointer; }

  .btn-add {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 14px;
    background: #1d1d1f;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s;
    margin-top: 10px;
  }
  .btn-add:active { opacity: 0.7; }

  .chart-wrapper {
    background: #fff;
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.04);
  }
  .chart-wrapper .chart-title {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: #c4c4c0;
    margin-bottom: 12px;
  }
  .chart-container {
    position: relative;
    height: 200px;
    display: flex;
    justify-content: center;
  }
  .chart-container canvas { max-height: 200px; max-width: 200px; }

  .cat-breakdown {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 16px;
  }
  .cat-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    background: #f8f7f4;
    border-radius: 10px;
    font-size: 12px;
  }
  .cat-item .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .cat-item .cat-label {
    color: #86868b;
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .cat-item .cat-amount {
    font-weight: 600;
    color: #1d1d1f;
    white-space: nowrap;
  }

  .section-title {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: #c4c4c0;
    margin: 20px 0 10px;
  }

  .expense-list { display: flex; flex-direction: column; gap: 6px; }

  .expense-item {
    background: #fff;
    border-radius: 14px;
    padding: 14px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    transition: opacity 0.2s;
  }
  .expense-item .left {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
    flex: 1;
  }
  .expense-item .icon {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }
  .expense-item .details { min-width: 0; flex: 1; }
  .expense-item .details .desc {
    font-size: 15px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .expense-item .details .meta {
    font-size: 12px;
    color: #c4c4c0;
    margin-top: 1px;
  }
  .expense-item .right {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
    margin-left: 12px;
  }
  .expense-item .amount {
    font-size: 16px;
    font-weight: 600;
  }
  .expense-item .delete {
    background: none;
    border: none;
    color: #e0dfd9;
    font-size: 20px;
    cursor: pointer;
    padding: 2px 6px;
    line-height: 1;
    transition: color 0.2s;
  }
  .expense-item .delete:active { color: #ff4444; }

  .empty-state {
    text-align: center;
    padding: 40px 0;
    color: #c4c4c0;
    font-size: 14px;
  }

  .bottom-actions {
    display: flex;
    gap: 10px;
    margin-top: 16px;
  }
  .bottom-actions button {
    flex: 1;
    padding: 12px;
    border: 1.5px solid #e8e7e2;
    border-radius: 14px;
    background: transparent;
    color: #86868b;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .bottom-actions button:active {
    border-color: #1d1d1f;
    color: #1d1d1f;
  }

  .tab-nav {
    display: flex;
    gap: 8px;
    margin: 12px 0 4px;
    background: #fff;
    padding: 6px;
    border-radius: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.04);
  }
  .tab-btn {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: 12px;
    background: transparent;
    color: #86868b;
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .tab-btn.active {
    background: #1d1d1f;
    color: #fff;
  }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: #1d1d1f;
    color: #fff;
    padding: 12px 24px;
    border-radius: 12px;
    font-size: 14px;
    opacity: 0;
    transition: all 0.35s ease;
    pointer-events: none;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>expenses</h1>
    <div class="month-nav">
      <button onclick="navigateMonth(-1)">&#8592;</button>
      <span class="month" id="monthDisplay"></span>
      <button onclick="navigateMonth(1)">&#8594;</button>
    </div>
  </div>

  <div class="tab-nav" id="tabNav">
    <button class="tab-btn active" onclick="switchTab('regular')" id="tabRegular">regular</button>
    <button class="tab-btn" onclick="switchTab('fun')" id="tabFun">fun</button>
  </div>

  <div class="total-card">
    <div class="label">month total</div>
    <div class="amount-row">
      <span class="currency">&#8377;</span>
      <span class="amount" id="totalAmount">0</span>
    </div>
    <div class="sub-info">
      <div>transactions <span id="txnCount">0</span></div>
      <div>daily avg <span id="dailyAvg">0</span></div>
    </div>
  </div>

  <div class="form-card">
    <div class="form-grid">
      <input type="number" id="amountInput" placeholder="Amount" step="0.01" min="0">
      <select id="categorySelect">
        <option value="Food">Food</option>
        <option value="Transport">Transport</option>
        <option value="Shopping">Shopping</option>
        <option value="Bills">Bills</option>
        <option value="Entertainment">Entertainment</option>
        <option value="Health">Health</option>
        <option value="Other">Other</option>
      </select>
      <input type="text" id="descInput" class="full" placeholder="What for? (optional)">
    </div>
    <div id="funBudgetSection" style="display: none; margin-top: 10px;">
      <div class="form-grid">
        <input type="number" id="funBudgetInput" placeholder="Monthly Fun Budget" step="0.01" min="0">
        <button class="btn-add" style="margin-top: 0;" onclick="handleSetFunBudget()">Set Budget</button>
      </div>
      <div id="budgetProgress" style="margin-top: 10px;"></div>
    </div>
    <button class="btn-add" onclick="addExpense()">+ add expense</button>
  </div>

  <div class="chart-wrapper" id="chartSection">
    <div class="chart-title">spending breakdown</div>
    <div class="chart-container">
      <canvas id="pieChart"></canvas>
    </div>
    <div class="cat-breakdown" id="catBreakdown"></div>
  </div>

  <div class="section-title">transactions</div>
  <div class="expense-list" id="expenseList"></div>

  <div class="bottom-actions">
    <button onclick="exportCSV()">export CSV</button>
    <button onclick="clearMonth()">clear month</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const CAT_META = {
    Food:           { color: '#4CAF50', icon: '🍽️' },
    Transport:      { color: '#2196F3', icon: '🚗' },
    Shopping:       { color: '#FF9800', icon: '🛍️' },
    Bills:          { color: '#F44336', icon: '📄' },
    Entertainment:  { color: '#9C27B0', icon: '🎬' },
    Health:         { color: '#00BCD4', icon: '💊' },
    Other:          { color: '#607D8B', icon: '📌' }
  };

  const FUN_CAT_META = {
    'Dining Out':   { color: '#FF5722', icon: '🍔' },
    'Games':        { color: '#673AB7', icon: '🎮' },
    'Hobbies':      { color: '#00BCD4', icon: '🎨' },
    'Travel':       { color: '#3F51B5', icon: '✈️' },
    'Events':       { color: '#E91E63', icon: '🎪' },
    'Subscriptions':{ color: '#9C27B0', icon: '📺' },
    'Other Fun':    { color: '#607D8B', icon: '🎯' }
  };

  let currentDate = new Date();
  let currentYear = currentDate.getFullYear();
  let currentMonth = currentDate.getMonth();
  let chartInstance = null;
  let activeTab = 'regular';

  function getExpenses(year, month) {
    const key = `exp_${year}_${String(month + 1).padStart(2, '0')}`;
    return JSON.parse(localStorage.getItem(key) || '[]');
  }

  function saveExpenses(year, month, expenses) {
    const key = `exp_${year}_${String(month + 1).padStart(2, '0')}`;
    localStorage.setItem(key, JSON.stringify(expenses));
  }

  function getFunExpenses(year, month) {
    const key = `fun_exp_${year}_${String(month + 1).padStart(2, '0')}`;
    return JSON.parse(localStorage.getItem(key) || '[]');
  }

  function saveFunExpenses(year, month, expenses) {
    const key = `fun_exp_${year}_${String(month + 1).padStart(2, '0')}`;
    localStorage.setItem(key, JSON.stringify(expenses));
  }

  function getFunBudget(year, month) {
    const key = `fun_budget_${year}_${String(month + 1).padStart(2, '0')}`;
    return parseFloat(localStorage.getItem(key) || '0');
  }

  function setFunBudget(year, month, budget) {
    const key = `fun_budget_${year}_${String(month + 1).padStart(2, '0')}`;
    localStorage.setItem(key, budget.toString());
  }

  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(el._t);
    el._t = setTimeout(() => el.classList.remove('show'), 1800);
  }

  function addExpense() {
    const amt = parseFloat(document.getElementById('amountInput').value);
    if (!amt || amt <= 0) { toast('enter a valid amount'); return; }
    const cat = document.getElementById('categorySelect').value;
    const desc = document.getElementById('descInput').value.trim() || cat;
    
    if (activeTab === 'regular') {
      const expenses = getExpenses(currentYear, currentMonth);
      expenses.push({ amount: amt, category: cat, description: desc, date: new Date().toISOString() });
      saveExpenses(currentYear, currentMonth, expenses);
    } else {
      const expenses = getFunExpenses(currentYear, currentMonth);
      expenses.push({ amount: amt, category: cat, description: desc, date: new Date().toISOString() });
      saveFunExpenses(currentYear, currentMonth, expenses);
    }
    
    document.getElementById('amountInput').value = '';
    document.getElementById('descInput').value = '';
    render();
    toast('expense added');
  }

  function handleSetFunBudget() {
    const budget = parseFloat(document.getElementById('funBudgetInput').value);
    if (!budget || budget <= 0) { toast('enter a valid budget'); return; }
    setFunBudget(currentYear, currentMonth, budget);
    document.getElementById('funBudgetInput').value = '';
    render();
    toast('budget set');
  }

  function deleteExpense(index) {
    if (activeTab === 'regular') {
      const expenses = getExpenses(currentYear, currentMonth);
      expenses.splice(index, 1);
      saveExpenses(currentYear, currentMonth, expenses);
    } else {
      const expenses = getFunExpenses(currentYear, currentMonth);
      expenses.splice(index, 1);
      saveFunExpenses(currentYear, currentMonth, expenses);
    }
    render();
  }

  function clearMonth() {
    const label = activeTab === 'regular' ? 'regular' : 'fun';
    if (!confirm(`Clear all ${label} expenses for this month?`)) return;
    if (activeTab === 'regular') saveExpenses(currentYear, currentMonth, []);
    else saveFunExpenses(currentYear, currentMonth, []);
    render();
    toast('month cleared');
  }

  function navigateMonth(delta) {
    currentMonth += delta;
    if (currentMonth > 11) { currentMonth = 0; currentYear++; }
    if (currentMonth < 0) { currentMonth = 11; currentYear--; }
    render();
  }

  function switchTab(tab) {
    activeTab = tab;
    document.getElementById('tabRegular').classList.toggle('active', tab === 'regular');
    document.getElementById('tabFun').classList.toggle('active', tab === 'fun');
    
    const catSelect = document.getElementById('categorySelect');
    catSelect.innerHTML = '';
    const cats = tab === 'regular' ? Object.keys(CAT_META) : Object.keys(FUN_CAT_META);
    cats.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      catSelect.appendChild(opt);
    });
    
    const budgetSection = document.getElementById('funBudgetSection');
    if (budgetSection) budgetSection.style.display = tab === 'fun' ? 'block' : 'none';
    
    render();
  }

  function render() {
    const monthNames = ['January','February','March','April','May','June',
      'July','August','September','October','November','December'];
    document.getElementById('monthDisplay').textContent =
      `${monthNames[currentMonth]} ${currentYear}`;

    let expenses;
    if (activeTab === 'regular') {
      expenses = getExpenses(currentYear, currentMonth);
    } else {
      expenses = getFunExpenses(currentYear, currentMonth);
    }

    const total = expenses.reduce((s, e) => s + e.amount, 0);
    document.getElementById('totalAmount').textContent =
      total % 1 === 0 ? total.toLocaleString('en-IN') : total.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
    const daysSoFar = Math.min(currentDate.getDate(), daysInMonth);
    const avg = expenses.length > 0 ? (total / daysSoFar) : 0;
    document.getElementById('txnCount').textContent = expenses.length;
    document.getElementById('dailyAvg').textContent =
      avg % 1 === 0 ? avg.toLocaleString('en-IN') : avg.toLocaleString('en-IN', { minimumFractionDigits: 1, maximumFractionDigits: 1 });

    renderChart(expenses);
    renderCatBreakdown(expenses);
    renderList(expenses);

    if (activeTab === 'fun') {
      renderFunBudget();
    }
  }

  function renderFunBudget() {
    const budget = getFunBudget(currentYear, currentMonth);
    const expenses = getFunExpenses(currentYear, currentMonth);
    const total = expenses.reduce((s, e) => s + e.amount, 0);
    const remaining = budget - total;
    const pct = budget > 0 ? Math.min((total / budget) * 100, 100) : 0;
    
    const el = document.getElementById('budgetProgress');
    if (budget > 0) {
      const isOver = total > budget;
      el.innerHTML = `
        <div style="background: #f8f7f4; border-radius: 10px; padding: 12px;">
          <div style="display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 8px;">
            <span style="color: #86868b;">Budget Used</span>
            <span style="font-weight: 600; color: ${isOver ? '#ff4444' : '#1d1d1f'}">
              ₹${total.toLocaleString('en-IN')} / ₹${budget.toLocaleString('en-IN')}
            </span>
          </div>
          <div style="background: #e8e7e2; border-radius: 6px; height: 8px; overflow: hidden;">
            <div style="width: ${pct}%; background: ${isOver ? '#ff4444' : '#4CAF50'}; height: 100%; transition: width 0.3s;"></div>
          </div>
          <div style="font-size: 11px; color: ${isOver ? '#ff4444' : '#86868b'}; margin-top: 6px;">
            ${isOver ? 'Over by' : 'Remaining'}: ₹${Math.abs(remaining).toLocaleString('en-IN')}
          </div>
        </div>
      `;
    } else {
      el.innerHTML = `
        <div style="text-align: center; padding: 8px; color: #c4c4c0; font-size: 12px;">
          Set a budget to track your fun spending
        </div>
      `;
    }
  }

  function renderChart(expenses) {
    const metaMap = activeTab === 'regular' ? CAT_META : FUN_CAT_META;
    const cats = {};
    expenses.forEach(e => { cats[e.category] = (cats[e.category] || 0) + e.amount; });

    const labels = Object.keys(cats);
    const data = Object.values(cats);
    const colors = labels.map(l => (metaMap[l] || { color: '#888' }).color);

    const ctx = document.getElementById('pieChart').getContext('2d');
    if (chartInstance) chartInstance.destroy();
    if (data.length === 0) {
      chartInstance = null;
      return;
    }
    chartInstance = new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels,
        datasets: [{ data, backgroundColor: colors, borderWidth: 0 }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: '#1d1d1f',
            padding: 10,
            titleFont: { size: 12 },
            bodyFont: { size: 13 },
            cornerRadius: 8,
            callbacks: {
              label: ctx => {
                const val = ctx.parsed;
                const pct = ((val / ctx.dataset.data.reduce((a, b) => a + b, 0)) * 100).toFixed(0);
                return ` ₹${val.toLocaleString('en-IN')}  ·  ${pct}%`;
              }
            }
          }
        },
        cutout: '68%'
      }
    });
  }

  function renderCatBreakdown(expenses) {
    const metaMap = activeTab === 'regular' ? CAT_META : FUN_CAT_META;
    const el = document.getElementById('catBreakdown');
    const cats = {};
    expenses.forEach(e => { cats[e.category] = (cats[e.category] || 0) + e.amount; });
    const entries = Object.entries(cats).sort((a, b) => b[1] - a[1]);
    el.innerHTML = entries.length === 0 ? '' : entries.map(([cat, amt]) => {
      const meta = metaMap[cat] || { color: '#888', icon: '📌' };
      const val = amt % 1 === 0 ? amt.toLocaleString('en-IN') : amt.toLocaleString('en-IN', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
      return `<div class="cat-item">
        <span class="dot" style="background:${meta.color}"></span>
        <span class="cat-label">${meta.icon} ${cat}</span>
        <span class="cat-amount">&#8377;${val}</span>
      </div>`;
    }).join('');
  }

  function renderList(expenses) {
    const list = document.getElementById('expenseList');
    if (expenses.length === 0) {
      list.innerHTML = `<div class="empty-state">no ${activeTab === 'regular' ? '' : 'fun '}transactions yet</div>`;
      return;
    }
    const metaMap = activeTab === 'regular' ? CAT_META : FUN_CAT_META;
    const items = [...expenses].reverse().map((e, i) => {
      const idx = expenses.length - 1 - i;
      const meta = metaMap[e.category] || { color: '#888', icon: '📌' };
      const amt = e.amount % 1 === 0 ? e.amount.toLocaleString('en-IN') : e.amount.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      const d = new Date(e.date);
      const dateStr = d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
      return `<div class="expense-item">
        <div class="left">
          <div class="icon" style="background:${meta.color}22">${meta.icon}</div>
          <div class="details">
            <div class="desc">${esc(e.description)}</div>
            <div class="meta">${esc(e.category)} · ${dateStr}</div>
          </div>
        </div>
        <div class="right">
          <span class="amount" style="color:${meta.color}">&#8377;${amt}</span>
          <button class="delete" onclick="deleteExpense(${idx})">&#215;</button>
        </div>
      </div>`;
    }).join('');
    list.innerHTML = items;
  }

  function esc(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function exportCSV() {
    const expenses = activeTab === 'regular' ? getExpenses(currentYear, currentMonth) : getFunExpenses(currentYear, currentMonth);
    if (expenses.length === 0) { toast('nothing to export'); return; }
    const monthNames = ['January','February','March','April','May','June',
      'July','August','September','October','November','December'];
    const header = 'Date,Category,Description,Amount';
    const rows = expenses.map(e =>
      `${new Date(e.date).toLocaleDateString('en-IN')},${e.category},"${e.description}",${e.amount}`
    ).join('\n');
    const blob = new Blob([header + '\n' + rows], { type: 'text/csv;charset=utf-8;' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    const prefix = activeTab === 'regular' ? 'expenses' : 'fun_expenses';
    a.download = `${prefix}_${monthNames[currentMonth]}_${currentYear}.csv`;
    a.click();
    URL.revokeObjectURL(a.href);
    toast('csv exported');
  }

  render();
</script>
</body>
</html>
