<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>expense tracker</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f8f7f4;color:#1d1d1f;min-height:100vh;padding:0 0 32px}
  .container{max-width:480px;margin:0 auto;padding:0 20px}
  .sync-bar{background:#fff;border-radius:14px;padding:10px 12px;margin:12px 0 0;box-shadow:0 1px 4px rgba(0,0,0,.04);font-size:12px}
  .sync-row{display:flex;gap:8px;align-items:center;margin-top:8px}
  .sync-row input{flex:1;padding:10px 12px;border:1.5px solid #f0efe9;border-radius:10px;background:#f8f7f4;font-size:13px;outline:none}
  .sync-row button{padding:10px 14px;border:none;border-radius:10px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
  .btn-dark{background:#1d1d1f;color:#fff}.btn-light{background:#f8f7f4;color:#86868b;border:1px solid #e8e7e2}
  .sync-status{color:#86868b;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .sync-status strong{color:#1d1d1f}
  .sync-hint{font-size:11px;color:#86868b;margin-top:6px;line-height:1.4}
  .header{text-align:center;padding:18px 0 6px}.header h1{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:3px;color:#c4c4c0}
  .month-nav{display:flex;justify-content:center;align-items:center;gap:24px}.month-nav button{background:none;border:none;font-size:20px;cursor:pointer;color:#c4c4c0;padding:4px 8px}.month-nav .month{font-size:22px;font-weight:700;min-width:180px;text-align:center}
  .total-card{background:linear-gradient(135deg,#1d1d1f 0%,#2d2d2f 100%);color:#fff;border-radius:24px;padding:28px 24px 24px;margin:16px 0;position:relative;overflow:hidden}
  .total-card::before{content:'';position:absolute;top:-40%;right:-20%;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.03)}
  .total-card .label{font-size:10px;text-transform:uppercase;letter-spacing:2.5px;color:#86868b}.total-card .amount-row{display:flex;align-items:baseline;gap:8px;margin-top:6px}.total-card .currency{font-size:22px;color:#86868b}.total-card .amount{font-size:44px;font-weight:700;letter-spacing:-2px}
  .total-card .sub-info{display:flex;gap:24px;margin-top:16px;padding-top:16px;border-top:1px solid rgba(255,255,255,.08)}.total-card .sub-info div{font-size:12px;color:#86868b}.total-card .sub-info span{color:#fff;font-weight:600}
  .form-card{background:#fff;border-radius:20px;padding:20px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form-grid .full{grid-column:1/-1}
  .form-grid input,.form-grid select{width:100%;padding:14px 16px;border:1.5px solid #f0efe9;border-radius:14px;font-size:15px;background:#f8f7f4;outline:none}
  .btn-add{width:100%;padding:16px;border:none;border-radius:14px;background:#1d1d1f;color:#fff;font-size:15px;font-weight:600;cursor:pointer;margin-top:10px}
  .chart-wrapper{background:#fff;border-radius:20px;padding:20px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
  .chart-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:2px;color:#c4c4c0;margin-bottom:12px}
  .chart-container{position:relative;height:200px;display:flex;justify-content:center}.chart-container canvas{max-height:200px;max-width:200px}
  .cat-breakdown{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
  .cat-item{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#f8f7f4;border-radius:10px;font-size:12px}.cat-item .dot{width:8px;height:8px;border-radius:50%}.cat-item .cat-label{color:#86868b;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cat-item .cat-amount{font-weight:600}
  .section-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:2px;color:#c4c4c0;margin:20px 0 10px}
  .expense-list{display:flex;flex-direction:column;gap:6px}.expense-item{background:#fff;border-radius:14px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 4px rgba(0,0,0,.04)}
  .expense-item .left{display:flex;align-items:center;gap:12px;flex:1;min-width:0}.expense-item .icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px}.expense-item .details{flex:1;min-width:0}.expense-item .desc{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.expense-item .meta{font-size:12px;color:#c4c4c0}.expense-item .right{display:flex;align-items:center;gap:4px;margin-left:12px}.expense-item .amount{font-size:16px;font-weight:600}.expense-item .delete{background:none;border:none;color:#e0dfd9;font-size:20px;cursor:pointer;padding:2px 6px}
  .empty-state{text-align:center;padding:40px 0;color:#c4c4c0;font-size:14px}
  .bottom-actions{display:flex;gap:10px;margin-top:16px}.bottom-actions button{flex:1;padding:12px;border:1.5px solid #e8e7e2;border-radius:14px;background:transparent;color:#86868b;font-size:13px;cursor:pointer}
  .tab-nav{display:flex;gap:8px;margin:12px 0 4px;background:#fff;padding:6px;border-radius:16px;box-shadow:0 1px 4px rgba(0,0,0,.04)}.tab-btn{flex:1;padding:10px;border:none;border-radius:12px;background:transparent;color:#86868b;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:1.5px;cursor:pointer}.tab-btn.active{background:#1d1d1f;color:#fff}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#1d1d1f;color:#fff;padding:12px 24px;border-radius:12px;font-size:14px;opacity:0;transition:all .35s;pointer-events:none;white-space:nowrap}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="container">
  <div class="sync-bar">
    <div class="sync-status" id="syncStatus">📱 offline — local only</div>
    <div class="sync-row">
      <input id="syncInput" placeholder="sync code (e.g. my-home-123)">
      <button class="btn-dark" onclick="createSync()">Create</button>
      <button class="btn-light" onclick="joinSync()">Join</button>
    </div>
    <div style="display:flex;gap:8px;margin-top:8px">
      <button class="btn-light" style="flex:1" onclick="copyCode()">Copy code</button>
      <button class="btn-light" style="flex:1" onclick="leaveSync()">Leave</button>
      <button class="btn-light" style="flex:1" onclick="forceSync()">Sync now</button>
    </div>
    <div class="sync-hint">No account needed. <b>Create</b> on one device → copy code → <b>Join</b> with same code on other device. Both stay in sync (JSON in cloud). Leave = back to local.</div>
  </div>
  <div class="header"><h1>expenses</h1><div class="month-nav"><button onclick="navigateMonth(-1)">←</button><span class="month" id="monthDisplay"></span><button onclick="navigateMonth(1)">→</button></div></div>
  <div class="tab-nav"><button class="tab-btn active" onclick="switchTab('regular')" id="tabRegular">regular</button><button class="tab-btn" onclick="switchTab('fun')" id="tabFun">fun</button></div>
  <div class="total-card"><div class="label">month total</div><div class="amount-row"><span class="currency">₹</span><span class="amount" id="totalAmount">0</span></div><div class="sub-info"><div>transactions <span id="txnCount">0</span></div><div>daily avg <span id="dailyAvg">0</span></div></div></div>
  <div class="form-card"><div class="form-grid"><input type="number" id="amountInput" placeholder="Amount" step="0.01"><select id="categorySelect"></select><input type="text" id="descInput" class="full" placeholder="What for? (optional)"></div><div id="funBudgetSection" style="display:none;margin-top:10px"><div class="form-grid"><input type="number" id="funBudgetInput" placeholder="Monthly Fun Budget"><button class="btn-add" style="margin-top:0" onclick="handleSetFunBudget()">Set Budget</button></div><div id="budgetProgress" style="margin-top:10px"></div></div><button class="btn-add" onclick="addExpense()">+ add expense</button></div>
  <div class="chart-wrapper"><div class="chart-title">spending breakdown</div><div class="chart-container"><canvas id="pieChart"></canvas></div><div class="cat-breakdown" id="catBreakdown"></div></div>
  <div class="section-title">transactions</div><div class="expense-list" id="expenseList"></div>
  <div class="bottom-actions"><button onclick="exportCSV()">export CSV</button><button onclick="clearMonth()">clear month</button></div>
</div>
<div class="toast" id="toast"></div>
<script>
const CAT_META={Food:{color:'#4CAF50',icon:'🍽️'},Transport:{color:'#2196F3',icon:'🚗'},Shopping:{color:'#FF9800',icon:'🛍️'},Bills:{color:'#F44336',icon:'📄'},Entertainment:{color:'#9C27B0',icon:'🎬'},Health:{color:'#00BCD4',icon:'💊'},Other:{color:'#607D8B',icon:'📌'}};
const FUN_CAT_META={'Dining Out':{color:'#FF5722',icon:'🍔'},Games:{color:'#673AB7',icon:'🎮'},Hobbies:{color:'#00BCD4',icon:'🎨'},Travel:{color:'#3F51B5',icon:'✈️'},Events:{color:'#E91E63',icon:'🎪'},Subscriptions:{color:'#9C27B0',icon:'📺'},'Other Fun':{color:'#607D8B',icon:'🎯'}};
let currentDate=new Date(),currentYear=currentDate.getFullYear(),currentMonth=currentDate.getMonth(),chartInstance=null,activeTab='regular';
let syncId=localStorage.getItem('syncId')||'', pantryId=localStorage.getItem('pantryId')||'', cloudData=null, pollTimer=null;
const JSONBLOB='https://jsonblob.com/api/jsonBlob';
const PANTRY_BASE='https://getpantry.cloud/apiv1/pantry';
function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),3000)}
function uid(){return Math.random().toString(36).slice(2,8)}
function isUUID(s){return /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(s)}
function updateSyncUI(){const s=document.getElementById('syncStatus'), inp=document.getElementById('syncInput'); inp.value=syncId; if(syncId&&isUUID(syncId)) s.innerHTML='☁️ <strong>synced</strong> — code: <strong>'+syncId.slice(0,8)+'</strong> <span style="color:#4CAF50">● live</span>'; else if(syncId) s.innerHTML='☁️ <strong>synced</strong> — code: <strong>'+syncId+'</strong> <span style="color:#4CAF50">● live</span>'; else s.innerHTML='📱 <strong>offline</strong> — local only';}
async function createSync(){
  let code=document.getElementById('syncInput').value.trim();
  const useCustom=!!code;
  toast('creating...');
  try{
    const init={regular:{},fun:{},budgets:{},created:Date.now()};
    for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i); if(k.startsWith('exp_')) init.regular[k]=JSON.parse(localStorage.getItem(k)); if(k.startsWith('fun_exp_')) init.fun[k]=JSON.parse(localStorage.getItem(k)); if(k.startsWith('fun_budget_')) init.budgets[k]=localStorage.getItem(k);}
    const r=await fetch(JSONBLOB,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(init)});
    if(!r.ok) throw new Error('jsonblob '+r.status);
    const loc=r.headers.get('location')||r.headers.get('Location')||''; let id=loc.split('/').pop();
    if(!id){ const t=await r.text(); try{id=JSON.parse(t).id}catch{} }
    if(!id||!isUUID(id)) throw new Error('no id');
    syncId=id; pantryId=id; localStorage.setItem('syncId',syncId); localStorage.setItem('pantryId',pantryId);
    cloudData=init; startPoll(); updateSyncUI(); toast('created! code: '+id.slice(0,8)+' — Copied, share it');
    try{await navigator.clipboard.writeText(id)}catch{}
  }catch(e){
    toast('cloud busy — trying backup...');
    try{
      let c=(code||'exp-'+uid()).toLowerCase().replace(/[^a-z0-9-]/g,'-');
      const r2=await fetch(PANTRY_BASE,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
      const j=await r2.json(); const pid=j.id||j.name; if(!pid) throw 1;
      const init2={regular:{},fun:{},budgets:{}}; await fetch(`${PANTRY_BASE}/${pid}/basket/${c}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(init2)});
      syncId=c; pantryId=pid; localStorage.setItem('syncId',syncId); localStorage.setItem('pantryId',pantryId); startPoll(); updateSyncUI(); toast('created with backup: '+c);
    }catch(e2){ toast('create failed: '+e.message+' — check internet / try again'); console.error(e,e2); }
  }
}
async function joinSync(){
  const code=document.getElementById('syncInput').value.trim();
  if(!code) return toast('enter code');
  let pid=pantryId;
  if(isUUID(code)){ syncId=code; pantryId=code; }
  else { if(!pid){ const p=prompt('Paste full code from creator (UUID):'); if(p) pid=p.trim(); else return toast('need full code'); } syncId=code; pantryId=pid; }
  localStorage.setItem('syncId',syncId); localStorage.setItem('pantryId',pantryId);
  try{
    let data=null;
    if(isUUID(syncId)){ const r=await fetch(`${JSONBLOB}/${syncId}`); if(r.ok) data=await r.json(); }
    if(!data && pantryId && syncId){ const r2=await fetch(`${PANTRY_BASE}/${pantryId}/basket/${syncId}`); if(r2.ok) data=await r2.json(); }
    if(!data) throw 1;
    cloudData=data; applyCloudData(); startPoll(); updateSyncUI(); toast('joined ☁️');
  }catch(e){ toast('join failed — check code'); console.error(e); }
}
function leaveSync(){ if(pollTimer) clearInterval(pollTimer); syncId=''; pantryId=''; localStorage.removeItem('syncId'); localStorage.removeItem('pantryId'); cloudData=null; updateSyncUI(); render(); toast('offline — local only'); }
function copyCode(){
  if(!syncId) return toast('no code — Create first');
  const txt=isUUID(syncId)?syncId:`Code: ${syncId}\nPantry: ${pantryId}`;
  navigator.clipboard.writeText(txt).then(()=>toast('copied — paste on other device')).catch(()=>prompt('Copy this:',txt));
}
async function fetchCloud(){
  if(!syncId) return null;
  try{
    if(isUUID(syncId)){ const r=await fetch(`${JSONBLOB}/${syncId}`); if(r.ok) return await r.json(); }
    if(pantryId&&syncId){ const r2=await fetch(`${PANTRY_BASE}/${pantryId}/basket/${syncId}`); if(r2.ok) return await r2.json(); }
    return null;
  }catch{ return null; }
}
async function pushCloud(){
  if(!syncId) return;
  const data={regular:{},fun:{},budgets:{}};
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(k.startsWith('exp_')) data.regular[k]=JSON.parse(localStorage.getItem(k));
    if(k.startsWith('fun_exp_')) data.fun[k]=JSON.parse(localStorage.getItem(k));
    if(k.startsWith('fun_budget_')) data.budgets[k]=localStorage.getItem(k);
  }
  data.updated=Date.now();
  cloudData=data;
  try{
    if(isUUID(syncId)) await fetch(`${JSONBLOB}/${syncId}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
    else if(pantryId) await fetch(`${PANTRY_BASE}/${pantryId}/basket/${syncId}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
  }catch{}
}
function applyCloudData(){
  if(!cloudData) return;
  Object.entries(cloudData.regular||{}).forEach(([k,v])=>localStorage.setItem(k,JSON.stringify(v)));
  Object.entries(cloudData.fun||{}).forEach(([k,v])=>localStorage.setItem(k,JSON.stringify(v)));
  Object.entries(cloudData.budgets||{}).forEach(([k,v])=>localStorage.setItem(k,String(v)));
  render();
}
async function forceSync(){
  if(!syncId||!pantryId) return toast('Create or Join first');
  toast('syncing...');
  const d=await fetchCloud(); if(d){ cloudData=d; applyCloudData(); toast('☁️ synced'); } else toast('sync failed');
}
function startPoll(){
  if(pollTimer) clearInterval(pollTimer);
  if(!syncId||!pantryId) return;
  pollTimer=setInterval(async()=>{
    const d=await fetchCloud();
    if(d && JSON.stringify(d)!==JSON.stringify(cloudData)){ cloudData=d; applyCloudData(); }
  },4000);
}
function getExpenses(y,m){ return JSON.parse(localStorage.getItem(`exp_${y}_${String(m+1).padStart(2,'0')}`)||'[]'); }
function getFunExpenses(y,m){ return JSON.parse(localStorage.getItem(`fun_exp_${y}_${String(m+1).padStart(2,'0')}`)||'[]'); }
function getFunBudget(y,m){ return parseFloat(localStorage.getItem(`fun_budget_${y}-${String(m+1).padStart(2,'0')}`)|| localStorage.getItem(`fun_budget_${y}_${String(m+1).padStart(2,'0')}`)||'0'); }
async function addExpense(){
  const amt=parseFloat(document.getElementById('amountInput').value); if(!amt||amt<=0) return toast('enter amount');
  const cat=document.getElementById('categorySelect').value; const desc=document.getElementById('descInput').value.trim()||cat;
  const doc={amount:amt,category:cat,description:desc,date:new Date().toISOString()};
  const k=(activeTab==='regular'?'exp_':'fun_exp_')+`${currentYear}_${String(currentMonth+1).padStart(2,'0')}`;
  const arr=JSON.parse(localStorage.getItem(k)||'[]'); arr.push(doc); localStorage.setItem(k,JSON.stringify(arr));
  document.getElementById('amountInput').value=''; document.getElementById('descInput').value=''; render(); toast(syncId?'☁️ saved & syncing...':'saved offline');
  if(syncId) await pushCloud();
}
async function handleSetFunBudget(){
  const b=parseFloat(document.getElementById('funBudgetInput').value); if(!b||b<=0) return toast('enter budget');
  const k=`fun_budget_${currentYear}-${String(currentMonth+1).padStart(2,'0')}`; localStorage.setItem(k,String(b));
  const k2=`fun_budget_${currentYear}_${String(currentMonth+1).padStart(2,'0')}`; localStorage.setItem(k2,String(b));
  document.getElementById('funBudgetInput').value=''; render(); toast(syncId?'☁️ budget syncing...':'budget set');
  if(syncId) await pushCloud();
}
async function deleteExpense(idx){
  const k=(activeTab==='regular'?'exp_':'fun_exp_')+`${currentYear}_${String(currentMonth+1).padStart(2,'0')}`;
  const arr=JSON.parse(localStorage.getItem(k)||'[]'); arr.splice(idx,1); localStorage.setItem(k,JSON.stringify(arr)); render();
  if(syncId) await pushCloud();
}
async function clearMonth(){
  if(!confirm(`Clear all ${activeTab} expenses for this month?`)) return;
  const k=(activeTab==='regular'?'exp_':'fun_exp_')+`${currentYear}_${String(currentMonth+1).padStart(2,'0')}`; localStorage.setItem(k,'[]'); render(); if(syncId) await pushCloud(); toast('cleared');
}
function navigateMonth(d){ currentMonth+=d; if(currentMonth>11){currentMonth=0;currentYear++;} if(currentMonth<0){currentMonth=11;currentYear--;} render(); }
function switchTab(t){ activeTab=t; document.getElementById('tabRegular').classList.toggle('active',t==='regular'); document.getElementById('tabFun').classList.toggle('active',t==='fun'); const s=document.getElementById('categorySelect'); s.innerHTML=''; const cats=t==='regular'?Object.keys(CAT_META):Object.keys(FUN_CAT_META); cats.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;s.appendChild(o)}); document.getElementById('funBudgetSection').style.display=t==='fun'?'block':'none'; render(); }
function render(){
  const ms=['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('monthDisplay').textContent=`${ms[currentMonth]} ${currentYear}`;
  const ex=activeTab==='regular'?getExpenses(currentYear,currentMonth):getFunExpenses(currentYear,currentMonth);
  const total=ex.reduce((s,e)=>s+e.amount,0);
  document.getElementById('totalAmount').textContent=total%1===0?total.toLocaleString('en-IN'):total.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
  const days=new Date(currentYear,currentMonth+1,0).getDate(); const avg=ex.length?(total/Math.min(new Date().getDate(),days)):0;
  document.getElementById('txnCount').textContent=ex.length; document.getElementById('dailyAvg').textContent=avg%1===0?avg.toLocaleString('en-IN'):avg.toLocaleString('en-IN',{minimumFractionDigits:1,maximumFractionDigits:1});
  renderChart(ex); renderCatBreakdown(ex); renderList(ex); if(activeTab==='fun') renderFunBudget();
}
function renderFunBudget(){ const b=getFunBudget(currentYear,currentMonth); const ex=getFunExpenses(currentYear,currentMonth); const total=ex.reduce((s,e)=>s+e.amount,0); const rem=b-total; const pct=b?Math.min((total/b)*100,100):0; const el=document.getElementById('budgetProgress'); if(b>0){const over=total>b; el.innerHTML=`<div style="background:#f8f7f4;border-radius:10px;padding:12px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:8px"><span style="color:#86868b">Budget Used</span><span style="font-weight:600;color:${over?'#ff4444':'#1d1d1f'}">₹${total.toLocaleString('en-IN')} / ₹${b.toLocaleString('en-IN')}</span></div><div style="background:#e8e7e2;border-radius:6px;height:8px;overflow:hidden"><div style="width:${pct}%;background:${over?'#ff4444':'#4CAF50'};height:100%"></div></div><div style="font-size:11px;color:${over?'#ff4444':'#86868b'};margin-top:6px">${over?'Over by':'Remaining'}: ₹${Math.abs(rem).toLocaleString('en-IN')}</div></div>`} else el.innerHTML=`<div style="text-align:center;padding:8px;color:#c4c4c0;font-size:12px">Set a budget to track fun spending</div>`}
function renderChart(ex){ const meta=activeTab==='regular'?CAT_META:FUN_CAT_META; const cats={}; ex.forEach(e=>cats[e.category]=(cats[e.category]||0)+e.amount); const labels=Object.keys(cats),data=Object.values(cats),colors=labels.map(l=>(meta[l]||{color:'#888'}).color); const ctx=document.getElementById('pieChart').getContext('2d'); if(chartInstance) chartInstance.destroy(); if(!data.length){chartInstance=null;return} chartInstance=new Chart(ctx,{type:'doughnut',data:{labels,datasets:[{data,backgroundColor:colors,borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{backgroundColor:'#1d1d1f',padding:10,cornerRadius:8,callbacks:{label:c=>` ₹${c.parsed.toLocaleString('en-IN')} · ${((c.parsed/c.dataset.data.reduce((a,b)=>a+b,0))*100).toFixed(0)}%`}}},cutout:'68%'}})}
function renderCatBreakdown(ex){ const meta=activeTab==='regular'?CAT_META:FUN_CAT_META; const el=document.getElementById('catBreakdown'); const cats={}; ex.forEach(e=>cats[e.category]=(cats[e.category]||0)+e.amount); const entries=Object.entries(cats).sort((a,b)=>b[1]-a[1]); el.innerHTML=entries.map(([c,a])=>{const m=meta[c]||{color:'#888',icon:'📌'}; const v=a%1===0?a.toLocaleString('en-IN'):a.toLocaleString('en-IN',{minimumFractionDigits:1,maximumFractionDigits:1}); return `<div class="cat-item"><span class="dot" style="background:${m.color}"></span><span class="cat-label">${m.icon} ${c}</span><span class="cat-amount">₹${v}</span></div>`}).join('')}
function renderList(ex){ const list=document.getElementById('expenseList'); if(!ex.length){list.innerHTML=`<div class="empty-state">no ${activeTab==='regular'?'':'fun '}transactions yet</div>`;return} const meta=activeTab==='regular'?CAT_META:FUN_CAT_META; list.innerHTML=[...ex].slice().reverse().map((e,i)=>{const idx=ex.length-1-i; const m=meta[e.category]||{color:'#888',icon:'📌'}; const a=e.amount%1===0?e.amount.toLocaleString('en-IN'):e.amount.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}); const d=new Date(e.date).toLocaleDateString('en-IN',{day:'numeric',month:'short'}); return `<div class="expense-item"><div class="left"><div class="icon" style="background:${m.color}22">${m.icon}</div><div class="details"><div class="desc">${esc(e.description)}</div><div class="meta">${esc(e.category)} · ${d}</div></div></div><div class="right"><span class="amount" style="color:${m.color}">₹${a}</span><button class="delete" onclick="deleteExpense(${idx})">×</button></div></div>`}).join('')}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function exportCSV(){ const ex=activeTab==='regular'?getExpenses(currentYear,currentMonth):getFunExpenses(currentYear,currentMonth); if(!ex.length) return toast('nothing to export'); const h='Date,Category,Description,Amount'; const rows=ex.map(e=>`${new Date(e.date).toLocaleDateString('en-IN')},${e.category},"${e.description}",${e.amount}`).join('\n'); const b=new Blob([h+'\n'+rows],{type:'text/csv'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=`${activeTab}_expenses_${currentMonth+1}_${currentYear}.csv`; a.click()}
switchTab('regular'); updateSyncUI(); if(syncId&&pantryId){ fetchCloud().then(d=>{if(d){cloudData=d;applyCloudData()}}); startPoll(); }
</script>
